</style></head><body><nav><h1>StatEase</h1><small>by Salek Data Lab</small><div id="nv"></div><button class="s" onclick="document.documentElement.dataset.t=document.documentElement.dataset.t=='dark'?'':'dark'">Dark / light</button></nav><main id="m"></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* ---------- distribution functions ---------- */
function lg(x){const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,.1208650973866179e-2,-.5395239384953e-5];let y=x,t=x+5.5;t-=(x+.5)*Math.log(t);let s=1.000000000190015;for(const k of c)s+=k/++y;return -t+Math.log(2.5066282746310005*s/x)}
function bcf(a,b,x){const qab=a+b,qap=a+1,qam=a-1;let c=1,d=1-qab*x/qap;if(Math.abs(d)<1e-30)d=1e-30;d=1/d;let h=d;for(let m=1;m<=300;m++){const m2=2*m;let aa=m*(b-m)*x/((qam+m2)*(a+m2));d=1+aa*d;if(Math.abs(d)<1e-30)d=1e-30;c=1+aa/c;if(Math.abs(c)<1e-30)c=1e-30;d=1/d;h*=d*c;aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));d=1+aa*d;if(Math.abs(d)<1e-30)d=1e-30;c=1+aa/c;if(Math.abs(c)<1e-30)c=1e-30;d=1/d;const e=d*c;h*=e;if(Math.abs(e-1)<3e-14)break}return h}
function ib(x,a,b){if(x<=0)return 0;if(x>=1)return 1;const bt=Math.exp(lg(a+b)-lg(a)-lg(b)+a*Math.log(x)+b*Math.log(1-x));return x<(a+1)/(a+b+2)?bt*bcf(a,b,x)/a:1-bt*bcf(b,a,1-x)/b}
function gp(a,x){if(x<=0)return 0;if(x<a+1){let ap=a,s=1/a,d=s;for(let i=0;i<500;i++){ap++;d*=x/ap;s+=d;if(Math.abs(d)<Math.abs(s)*1e-15)break}return s*Math.exp(-x+a*Math.log(x)-lg(a))}let b=x+1-a,c=1e30,d=1/b,h=d;for(let i=1;i<500;i++){const an=-i*(i-a);b+=2;d=an*d+b;if(Math.abs(d)<1e-30)d=1e-30;c=b+an/c;if(Math.abs(c)<1e-30)c=1e-30;d=1/d;const e=d*c;h*=e;if(Math.abs(e-1)<1e-15)break}return 1-Math.exp(-x+a*Math.log(x)-lg(a))*h}
const pChi=(x,df)=>1-gp(df/2,x/2),pT2=(t,df)=>ib(df/(df+t*t),df/2,.5);
function qn(p){const a=[-39.69683028665376,220.9460984245205,-275.9285104469687,138.357751867269,-30.66479806614716,2.506628277459239],b=[-54.47609879822406,161.5858368580409,-155.6989798598866,66.80131188771972,-13.28068155288572],c=[-.007784894002430293,-.3223964580411365,-2.400758277161838,-2.549732539343734,4.374664141464968,2.938163982698783],d=[.007784695709041462,.3224671290700398,2.445134137142996,3.754408661907416];let q,r;if(p<.02425){q=Math.sqrt(-2*Math.log(p));return(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1)}if(p>.97575){q=Math.sqrt(-2*Math.log(1-p));return-(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1)}q=p-.5;r=q*q;return(((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1)}
function qt(p,df){let lo=0,hi=1e4;for(let i=0;i<200;i++){const m=(lo+hi)/2;(1-pT2(m,df)/2<p)?lo=m:hi=m}return(lo+hi)/2}
/* ---------- descriptive helpers ---------- */
const sum=a=>a.reduce((x,y)=>x+y,0),mean=a=>sum(a)/a.length,vr=a=>{const m=mean(a);return sum(a.map(x=>(x-m)**2))/(a.length-1)};
function qtl(s,p){const h=(s.length-1)*p,l=Math.floor(h);return s[l]+(h-l)*((s[l+1]??s[l])-s[l])}
function desc(a){const n=a.length;if(n<4)return{n};const s=[...a].sort((x,y)=>x-y),m=mean(a),v=vr(a),m2=sum(a.map(x=>(x-m)**2))/n,m3=sum(a.map(x=>(x-m)**3))/n,m4=sum(a.map(x=>(x-m)**4))/n,g2=m4/m2**2-3,f={};a.forEach(x=>f[x]=(f[x]||0)+1);const mx=Math.max(...Object.values(f));
return{n,mean:m,sd:Math.sqrt(v),var:v,median:qtl(s,.5),q1:qtl(s,.25),q3:qtl(s,.75),IQR:qtl(s,.75)-qtl(s,.25),min:s[0],max:s[n-1],skew:Math.sqrt(n*(n-1))/(n-2)*m3/m2**1.5,kurt:(n-1)/((n-2)*(n-3))*((n+1)*g2+6),mode:Object.keys(f).filter(k=>f[k]==mx).slice(0,3).join(', ')}}
const fx=(x,d=3)=>typeof x=='number'&&isFinite(x)?x.toFixed(d):x??'',fp=p=>p<.001?'< .001':fx(p,3).replace(/^0/,'');
/* ---------- data ---------- */
let D={c:[],r:[],t:{}};
const miss=v=>v==null||/^(|na|nan|null|\.)$/i.test(String(v).trim());
function parse(t){const R=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==','){r.push(f);f=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);R.push(r);r=[];f=''}else f+=c}if(f!==''||r.length){r.push(f);R.push(r)}return R.filter(r=>r.some(x=>x!==''))}
function load(txt){const R=parse(txt);if(R.length<2)return alert('Need a header and at least one row.');D.c=R[0].map(x=>x.trim());D.r=R.slice(1);D.t={};D.c.forEach((c,j)=>{const v=D.r.map(r=>r[j]).filter(x=>!miss(x));const nu=v.filter(x=>isFinite(+x)).length;D.t[c]=!v.length?'empty':nu/v.length>=.95?(new Set(v).size>10?'continuous':'categorical (numeric code)'):'categorical'});show('data')}
const raw=c=>D.r.map(r=>r[D.c.indexOf(c)]),vals=c=>raw(c).filter(x=>!miss(x)),nums=c=>vals(c).map(Number).filter(isFinite);
const pair=(a,b)=>{const ia=D.c.indexOf(a),ib_=D.c.indexOf(b),x=[],y=[];D.r.forEach(r=>{if(!miss(r[ia])&&!miss(r[ib_])){x.push(r[ia]);y.push(r[ib_])}});return[x,y]};
const opts=(f=()=>1)=>D.c.filter(c=>f(D.t[c])).map(c=>`<option>${esc(c)}</option>`).join(''),isN=t=>t=='continuous'||t=='categorical (numeric code)';
function dl(name,txt,type='text/csv'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click()}
const csv=rows=>rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',')).join('\n');
const tbl=(h,rows)=>`<div class="w"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table></div>`;
const need=()=>D.c.length?'':'<p class="no">Load a dataset first (Data Import).</p>';
/* ---------- modules ---------- */
const ST={1:['Functional · self-tested','f1'],2:['Functional · not fully validated','f2'],3:['Backend required','f3'],4:['Planned','f4']};
const M=[['data','1. Data Import & Management',2],['clean','2. Cleaning & Transformation',4],['desc','3. Descriptive Statistics',2],['eda','4. EDA & Graph Studio',2],['tests','5. Hypothesis Testing',1],['corr','6. Correlation Analysis',1],['reg','7. Regression & Advanced Models',3],['survey','8. Complex Survey (BDHS/MICS)',3],['multi','9. Multilevel Models',3],['diag','10. Model Diagnostics',3],['sel','11. Model Selection Assistant',4],['apa','12. APA 7 Table Generator',2],['graph','13. Graph Studio (advanced types)',4],['ss','14. SampleSize Pro',1],['lit','15. Literature Matrix',2],['code','16. Syntax Generator',4],['interp','17. EN / BN Interpretation',2],['report','18. Report Generator',4],['soft','19. Software & Export Center',4],['val','20. Validation Dashboard',2]];
const BK={clean:'Recode, dummies, interactions, standardisation, merge: UI planned; client-side implementation next.',reg:'R: stats, MASS, quantreg, mgcv, pscl, glmmTMB, geepack, survival, MatchIt. No model results are shown until a backend executes them.',survey:'R survey / srvyr (svydesign, svyglm, svychisq, svyby with design df). Survey-specific variable mappings per BDHS/MICS round are required; structures are not assumed identical.',multi:'R lme4 / glmmTMB, or Stata mixed/meglm; survey-weighted multilevel needs level-specific weights (e.g. Stata gsem/mixed pweight, R WeMix). A single individual weight is not sufficient.',diag:'Diagnostics depend on a fitted model (VIF, residuals, separation, ROC/calibration, PH tests) and appear only after backend fitting.',sel:'Rule-based assistant mapping outcome type and design to candidate models; planned.',graph:'Basic histogram and scatter are live in EDA. Forest, ROC, KM, caterpillar etc. need model output.',code:'Reproducible R/Stata/SPSS/Python/ipynb generators; planned. Code generation is not execution.',report:'DOCX/PDF/XLSX report builder; planned. Reports will state method, n, missing-data handling, engine and design.',soft:'R, Stata, SPSS, Python, Excel: this page does not execute licensed software. Code export planned; execution requires a configured integration.'};
const V={};
function show(id){document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.id==id));const m=M.find(x=>x[0]==id);$('#m').innerHTML=(V[id]?V[id]():`<div class="cd"><h2>${m[1]}</h2><p>${BK[id]||''}</p><p><b>Execution status:</b> ${ST[m[2]][0]}. No results are computed or invented.</p></div>`)+`<p class="mu">StatEase v1 · Salek Data Lab · Md Salek Miah, B.Sc. (Hons) Statistics, SUST, Sylhet · saleksta@gmail.com · <a href="https://github.com/muhammadsalek">GitHub</a></p>`;if(V['_'+id])V['_'+id]()}
$('#nv').innerHTML=`<a data-id="home" onclick="show('home')">Overview</a>`+M.map(m=>`<a data-id="${m[0]}" onclick="show('${m[0]}')"><span>${m[1]}</span><span class="b ${ST[m[2]][1]}" title="${ST[m[2]][0]}">${m[2]}</span></a>`).join('');
V.home=()=>`<div class="cd"><h2>StatEase</h2><p>Browser-side statistical analysis. Everything computed here runs on your data, in your browser. Methods needing R/Python are listed with their status and produce no numbers.</p><p>Statuses: <span class="b f1">1</span> functional &amp; self-tested · <span class="b f2">2</span> functional, not fully validated · <span class="b f3">3</span> backend required · <span class="b f4">4</span> planned</p></div><div class="cd">${tbl(['Module','Status'],M.map(m=>[`<a href="#" onclick="show('${m[0]}');return false">${m[1]}</a>`,`<span class="b ${ST[m[2]][1]}">${ST[m[2]][0]}</span>`]))}</div>`;
show.__=0;
/* data */
V.data=()=>`<div class="cd"><h2>Data Import</h2><input type="file" id="fi" accept=".csv,.xlsx,.sav,.dta,.rds,.RData"><p class="mu">CSV works in-browser. .xlsx/.sav/.dta/.rds/.RData need a backend (R haven/readxl or Python pyreadstat); not parsed here.</p><label>Or paste CSV</label><textarea id="pt" rows="4" style="width:100%"></textarea><button onclick="load($('#pt').value)">Load pasted CSV</button></div>`+(D.c.length?`<div class="cd"><h2>Dictionary &amp; missingness (${D.r.length} rows × ${D.c.length} vars)</h2>${tbl(['Variable','Type (detected)','Non-missing','Missing %','Unique'],D.c.map(c=>[esc(c),D.t[c],vals(c).length,fx(100*(1-vals(c).length/D.r.length),1),new Set(vals(c)).size]))}<button class="s" onclick="dl('data.csv',csv([D.c,...D.r]))">Export CSV</button><h2 style="margin-top:12px">Preview</h2>${tbl(D.c.map(esc),D.r.slice(0,10).map(r=>r.map(esc)))}</div>`:'');
V._data=()=>{$('#fi').onchange=e=>{const f=e.target.files[0];if(!f)return;if(!/\.csv$/i.test(f.name))return alert('This format requires the backend (not yet implemented).');const r=new FileReader();r.onload=()=>load(r.result);r.readAsText(f)}};
/* descriptives */
V.desc=()=>`<div class="cd"><h2>Descriptive statistics</h2>${need()}<label>Numeric variables (select any number, Ctrl/Cmd+click)</label><select id="dv" multiple size="8" style="width:100%">${opts(isN)}</select><button onclick="runDesc()">Compute</button><div id="out"></div><p class="mu">Unweighted, complete cases per variable. Skewness/kurtosis: adjusted Fisher-Pearson G1/G2 (excess). Quartiles: type 7. Weighted/survey estimates need the backend.</p></div>`;
window.runDesc=()=>{const sel=[...$('#dv').selectedOptions].map(o=>o.value),k=['n','mean','sd','var','median','q1','q3','IQR','min','max','skew','kurt','mode'];$('#out').innerHTML=tbl(['Variable',...k],sel.map(c=>{const d=desc(nums(c));return[esc(c),...k.map(x=>typeof d[x]=='number'?fx(d[x],x=='n'?0:3):d[x]??'')]}))};
/* tests */
const pl=(p,en)=>p<.05?[`${en}: statistically significant at α = .05 (p ${p<.001?'< .001':'= '+fx(p,3)}).`,`${en === 'Association' ? 'সম্পর্ক' : 'পার্থক্য'} ৫% স্তরে পরিসংখ্যানগতভাবে তাৎপর্যপূর্ণ (p ${p<.001?'< .001':'= '+fx(p,3)})। এটি কার্যকারণ সম্পর্ক প্রমাণ করে না।`]:[`${en}: not statistically significant at α = .05 (p = ${fx(p,3)}).`,`৫% স্তরে পরিসংখ্যানগতভাবে তাৎপর্যপূর্ণ নয় (p = ${fx(p,3)})। এর অর্থ প্রভাব নেই তা নয়।`];
V.tests=()=>`<div class="cd"><h2>Hypothesis tests</h2>${need()}<label>Test</label><select id="tt" onchange="tsel()"><option value="ind">Independent t-test (Welch)</option><option value="one">One-sample t-test</option><option value="pai">Paired t-test</option><option value="pea">Pearson correlation</option><option value="chi">Chi-square (independence)</option></select><div class="g"><div><label id="l1">Outcome (numeric)</label><select id="v1">${opts(isN)}</select></div><div><label id="l2">Group variable (2 levels)</label><select id="v2">${opts()}</select></div><div id="mu0"><label>μ0 (one-sample)</label><input id="m0" value="0" size="6"></div></div><button onclick="runTest()">Run</button><div id="out"></div><p class="mu">Not yet implemented in-browser: Fisher, McNemar, Mann–Whitney, Wilcoxon, Kruskal–Wallis, ANOVA (planned), survey-adjusted tests (backend). Missing data: pairwise complete cases.</p></div>`;
window.tsel=()=>{const t=$('#tt').value,c=t=='chi';$('#l1').textContent=c?'Variable 1':t=='ind'?'Outcome (numeric)':'Variable (numeric)';$('#l2').textContent=t=='ind'?'Group variable (2 levels)':'Variable 2';$('#v1').innerHTML=opts(c?undefined:isN);$('#v2').innerHTML=opts(t=='pai'||t=='pea'?isN:undefined);$('#v2').parentNode.style.display=t=='one'?'none':'';$('#mu0').style.display=t=='one'?'':'none'};
window.runTest=()=>{const t=$('#tt').value,a=$('#v1').value,b=$('#v2').value;let rows=[],en,bn,w='';
const ci=(est,se,df)=>{const q=qt(.975,df);return`[${fx(est-q*se)}, ${fx(est+q*se)}]`};
if(t=='one'){const x=nums(a),n=x.length,m=mean(x),s=Math.sqrt(vr(x)),mu=+$('#m0').value,se=s/Math.sqrt(n),T=(m-mu)/se,df=n-1,p=pT2(T,df);rows=[['n',n],['Mean (SD)',`${fx(m)} (${fx(s)})`],['t',fx(T)],['df',df],['p',fp(p)],['Mean diff 95% CI',ci(m-mu,se,df)],["Cohen's d",fx((m-mu)/s)]];[en,bn]=pl(p,'Difference')}
else if(t=='ind'){const lv=[...new Set(vals(b))];if(lv.length!=2)return $('#out').innerHTML=`<p class="no">Group variable has ${lv.length} levels; exactly 2 required (ANOVA/Kruskal planned).</p>`;const ia=D.c.indexOf(a),ig=D.c.indexOf(b),g=lv.map(l=>D.r.filter(r=>r[ig]==l&&!miss(r[ia])&&isFinite(+r[ia])).map(r=>+r[ia])),[n1,n2]=g.map(x=>x.length),[m1,m2]=g.map(mean),[v1,v2]=g.map(vr),se=Math.sqrt(v1/n1+v2/n2),T=(m1-m2)/se,df=(v1/n1+v2/n2)**2/((v1/n1)**2/(n1-1)+(v2/n2)**2/(n2-1)),p=pT2(T,df),sp=Math.sqrt(((n1-1)*v1+(n2-1)*v2)/(n1+n2-2));rows=[[`${esc(lv[0])}: n, mean (SD)`,`${n1}, ${fx(m1)} (${fx(Math.sqrt(v1))})`],[`${esc(lv[1])}: n, mean (SD)`,`${n2}, ${fx(m2)} (${fx(Math.sqrt(v2))})`],['Welch t',fx(T)],['df',fx(df,2)],['p',fp(p)],['Mean diff 95% CI',ci(m1-m2,se,df)],["Cohen's d (pooled SD)",fx((m1-m2)/sp)]];w='Welch test used (no equal-variance assumption). Check normality/outliers for small groups.';[en,bn]=pl(p,'Difference')}
else if(t=='pai'||t=='pea'){const[X,Y]=pair(a,b),x=X.map(Number),y=Y.map(Number),n=x.length;if(t=='pai'){const d=x.map((v,i)=>v-y[i]),m=mean(d),s=Math.sqrt(vr(d)),se=s/Math.sqrt(n),T=m/se,p=pT2(T,n-1);rows=[['Pairs (n)',n],['Mean diff (SD)',`${fx(m)} (${fx(s)})`],['t',fx(T)],['df',n-1],['p',fp(p)],['95% CI',ci(m,se,n-1)],["Cohen's dz",fx(m/s)]];[en,bn]=pl(p,'Difference')}else{const mx=mean(x),my=mean(y),r=sum(x.map((v,i)=>(v-mx)*(y[i]-my)))/Math.sqrt(sum(x.map(v=>(v-mx)**2))*sum(y.map(v=>(v-my)**2))),T=r*Math.sqrt((n-2)/(1-r*r)),p=pT2(T,n-2),z=Math.atanh(r),se=1/Math.sqrt(n-3),k=qn(.975);rows=[['n',n],['r',fx(r)],['t',fx(T)],['df',n-2],['p',fp(p)],['95% CI (Fisher z)',`[${fx(Math.tanh(z-k*se))}, ${fx(Math.tanh(z+k*se))}]`]];w='Pearson assumes linearity and approx. bivariate normality; inspect a scatterplot.';[en,bn]=pl(p,'Association')}}

$('#out').innerHTML=tbl(['Statistic','Value'],rows)+`<p class="mu">${w}</p><p><b>EN:</b> ${en}</p><p><b>বাংলা:</b> ${bn}</p>`};
V.corr=V.tests;V._corr=()=>{$('#tt').value='pea';tsel()};V._tests=()=>{};
/* EDA / charts */
V.eda=()=>`<div class="cd"><h2>EDA: histogram &amp; scatterplot</h2>${need()}<div class="g"><div><label>Chart</label><select id="ct"><option>Histogram</option><option>Scatterplot</option></select></div><div><label>X</label><select id="cx">${opts(isN)}</select></div><div><label>Y (scatter)</label><select id="cy">${opts(isN)}</select></div><div><label>Title</label><input id="ti"></div><div><label>Colour</label><input id="co" type="color" value="#0f9d78"></div><div><label>PNG DPI</label><select id="dp"><option>96</option><option>300</option><option>600</option></select></div></div><button onclick="chart()">Draw</button><button class="s" onclick="dsvg()">SVG</button><button class="s" onclick="dpng()">PNG</button><div id="ch"></div></div>`;
window.chart=()=>{const t=$('#ct').value,x=$('#cx').value,col=$('#co').value,W=640,H=400,P=55;let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" font-family="sans-serif"><rect width="100%" height="100%" fill="#fff"/><text x="${W/2}" y="22" text-anchor="middle" font-size="15" fill="#10243a">${esc($('#ti').value)}</text><path d="M${P} ${H-P}H${W-15}M${P} ${H-P}V35" stroke="#333" fill="none"/>`;
if(t=='Histogram'){const v=nums(x);if(!v.length)return;const k=Math.ceil(Math.log2(v.length)+1),lo=Math.min(...v),hi=Math.max(...v),w=(hi-lo||1)/k,c=Array(k).fill(0);v.forEach(a=>c[Math.min(k-1,Math.floor((a-lo)/w))]++);const mc=Math.max(...c),bw=(W-P-15)/k;c.forEach((n,i)=>s+=`<rect x="${P+i*bw}" y="${H-P-n/mc*(H-P-40)}" width="${bw-1}" height="${n/mc*(H-P-40)}" fill="${col}"/>`);s+=`<text x="${P}" y="${H-P+16}" font-size="11">${fx(lo,2)}</text><text x="${W-15}" y="${H-P+16}" font-size="11" text-anchor="end">${fx(hi,2)}</text><text x="${W/2}" y="${H-10}" text-anchor="middle" font-size="12">${esc(x)}</text><text x="${P-6}" y="45" text-anchor="end" font-size="11">${mc}</text><text transform="translate(14 ${H/2}) rotate(-90)" text-anchor="middle" font-size="12">Frequency</text>`}
else{const y=$('#cy').value,[X,Y]=pair(x,y),a=X.map(Number),b=Y.map(Number);if(!a.length)return;const x0=Math.min(...a),x1=Math.max(...a),y0=Math.min(...b),y1=Math.max(...b);a.forEach((u,i)=>s+=`<circle cx="${P+(u-x0)/(x1-x0||1)*(W-P-20)}" cy="${H-P-(b[i]-y0)/(y1-y0||1)*(H-P-40)}" r="3" fill="${col}" fill-opacity=".6"/>`);s+=`<text x="${W/2}" y="${H-10}" text-anchor="middle" font-size="12">${esc(x)}</text><text transform="translate(14 ${H/2}) rotate(-90)" text-anchor="middle" font-size="12">${esc(y)}</text>`}
$('#ch').innerHTML=s+'</svg>'};
window.dsvg=()=>{const s=$('#ch svg');s&&dl('figure.svg',s.outerHTML,'image/svg+xml')};
window.dpng=()=>{const s=$('#ch svg');if(!s)return;const k=+$('#dp').value/96,im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=640*k;c.height=400*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='figure.png';a.click()})};im.src='data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(s.outerHTML)))};
/* APA Table 1 */
V.apa=()=>`<div class="cd"><h2>APA Table 1: sample characteristics (unweighted)</h2>${need()}<select id="av" multiple size="8" style="width:100%">${opts()}</select><label>Decimals</label><input id="dc" value="2" size="3"><button onclick="apa()">Build</button><div id="out"></div><p class="mu">Continuous: M (SD); categorical: n (%) of non-missing. Weighted %, CIs, regression tables, editable .docx/.xlsx/.pdf: backend/planned (CSV and HTML export only).</p></div>`;
let AP=[];window.apa=()=>{const d=+$('#dc').value;AP=[['Variable','Category','Statistic']];[...$('#av').selectedOptions].forEach(o=>{const c=o.value;if(D.t[c]=='continuous'){const x=nums(c);AP.push([c,'',`${fx(mean(x),d)} (${fx(Math.sqrt(vr(x)),d)})`])}else{const v=vals(c),L=[...new Set(v)].sort();L.forEach((l,i)=>AP.push([i?'':c,l,`${v.filter(z=>z==l).length} (${fx(100*v.filter(z=>z==l).length/v.length,1)}%)`]))}});$('#out').innerHTML=tbl(AP[0],AP.slice(1).map(r=>r.map(esc)))+`<p class="mu"><i>Note.</i> M = mean; SD = standard deviation. Percentages use non-missing counts.</p><button class="s" onclick="dl('table1.csv',csv(AP))">CSV</button><button class="s" onclick="dl('table1.html','<table border=1>'+AP.map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</table>','text/html')">HTML</button>`};
/* SampleSize */
V.ss=()=>`<div class="cd"><h2>SampleSize Pro</h2><div class="g"><div><label>Design</label><select id="sd" onchange="ssf()"><option value="p">Single proportion</option><option value="p2">Two proportions</option><option value="m">Single mean (precision)</option><option value="m2">Two means</option></select></div><div><label>Confidence %</label><input id="ca" value="95"></div><div id="pw"><label>Power %</label><input id="po" value="80"></div><div id="f1"><label>Expected p (or p1)</label><input id="p1" value="0.5"></div><div id="f2"><label>d (margin) / p2 / SD</label><input id="p2" value="0.05"></div><div id="f3"><label>δ (two means)</label><input id="p3" value="5"></div><div><label>Design effect</label><input id="de" value="1"></div><div><label>Population N (optional)</label><input id="pn"></div><div><label>Nonresponse %</label><input id="nr" value="0"></div></div><button onclick="ss()">Calculate</button><div id="out"></div></div>`;
window.ssf=()=>{const t=$('#sd').value;$('#pw').style.display=t=='p2'||t=='m2'?'':'none';$('#f1').style.display=t[0]=='p'?'':'none';$('#f3').style.display=t=='m2'?'':'none'};V._ss=ssf;
window.ss=()=>{const t=$('#sd').value,z=qn(1-(1-$('#ca').value/100)/2),zb=qn($('#po').value/100),a=+$('#p1').value,b=+$('#p2').value,dl_=+$('#p3').value,de=+$('#de').value||1,N=+$('#pn').value,nr=+$('#nr').value/100;let n0,f,L=[];
if(t=='p'){n0=z*z*a*(1-a)/b**2;f='n = Z²·p(1−p)/d²';L.push(`Z=${fx(z,4)}, p=${a}, d=${b}`)}
else if(t=='p2'){const p1=a,p2=b,pb=(p1+p2)/2;n0=(z*Math.sqrt(2*pb*(1-pb))+zb*Math.sqrt(p1*(1-p1)+p2*(1-p2)))**2/(p1-p2)**2;f='n per group = [Zα/2√(2p̄q̄) + Zβ√(p1q1+p2q2)]² / (p1−p2)²';L.push(`Zα/2=${fx(z,4)}, Zβ=${fx(zb,4)}, p1=${p1}, p2=${p2}`)}
else if(t=='m'){n0=(z*b/1)**2;f='n = (Z·σ/d)² (enter σ in the third field as SD; d = 1 unit; scale d by changing SD ÷ d)';L.push(`Z=${fx(z,4)}, σ/d=${b}`)}
else{n0=2*(z+zb)**2*b**2/dl_**2;f='n per group = 2(Zα/2+Zβ)²σ²/δ²';L.push(`Zα/2=${fx(z,4)}, Zβ=${fx(zb,4)}, σ=${b}, δ=${dl_}`)}
let n=n0*de;L.push(`Initial n0 = ${fx(n0,2)}`,`× design effect ${de} = ${fx(n,2)}`);if(N>0){n=n/(1+(n-1)/N);L.push(`Finite population correction (N=${N}) → ${fx(n,2)}`)}if(nr>0){n=n/(1-nr);L.push(`Nonresponse ${nr*100}% → ${fx(n,2)}`)}
$('#out').innerHTML=`<p><b>Formula:</b> ${f}</p><ul>${L.map(x=>`<li>${x}</li>`).join('')}</ul><p><b>Required sample size${t.endsWith('2')?' per group':''}: ${Math.ceil(n)}</b></p><p class="mu">Worked example: p=0.5, d=0.05, 95% → n0=384.16 → 385. Cluster sampling beyond a design-effect multiplier and regression planning: planned.</p>`};
/* Literature matrix */
const LF=['Author/year','Title','DOI','Country','Design','Dataset','Population','Sample size','Methods','Findings','Limitations','Research gap','Objectives'];let LR=[];
V.lit=()=>`<div class="cd"><h2>Literature Review Matrix</h2><div class="g">${LF.map((f,i)=>`<div><label>${f}</label><input id="L${i}"></div>`).join('')}</div><button onclick="LR.push(LF.map((_,i)=>$('#L'+i).value));lt()">Add</button><label>Search</label><input id="ls" oninput="lt()"><div id="lt"></div><button class="s" onclick="dl('literature.csv',csv([LF,...LR]))">Export CSV</button><p class="mu">Manual entry only; AI extraction (grounded in source documents) and Excel export are planned.</p></div>`;
window.lt=()=>{const q=$('#ls').value.toLowerCase();$('#lt').innerHTML=tbl(LF,LR.filter(r=>r.join(' ').toLowerCase().includes(q)).map(r=>r.map(esc)))};V._lit=lt;
/* Interpretation */
V.interp=()=>`<div class="cd"><h2>English / Bengali interpretation</h2><p>Interpretations are generated from the actual results of the test you run under Hypothesis Testing / Correlation (EN + বাংলা appear beneath each result). Academic-English and APA reporting sentences: planned. Interpretations for backend-fitted models will be generated only from returned estimates.</p></div>`;

V.val=()=>`<div class="cd"><h2>Validation (live self-test)</h2><p>Reference values from R (pt, pchisq, qnorm, qt). Pass/fail below is computed now in your browser.</p><button onclick="vt()">Run self-tests</button><div id="out"></div><p class="mu">Scope: distribution functions and formulas used here. Survey estimation, models and missing-data handling are not validated (backend required).</p></div>`;
window.vt=()=>{const T=[['2·P(T>2), df=10 (R: 0.07338803)',pT2(2,10),.07338803,1e-7],['P(χ²>3.841459), df=1 (R: 0.05)',pChi(3.841459,1),.05,1e-6],['P(χ²>9.21034), df=2 (R: 0.01)',pChi(9.21034,2),.01,1e-6],['qnorm(.975) (R: 1.959964)',qn(.975),1.959964,1e-6],['qt(.975, 10) (R: 2.228139)',qt(.975,10),2.228139,1e-5],['Sample size p=.5,d=.05,95% (384.16)',1.959964**2*.25/.0025,384.1459,1e-3]];$('#out').innerHTML=tbl(['Check','Computed','Reference','Tolerance','Result'],T.map(([n,c,r,tl])=>[n,fx(c,7),r,tl,Math.abs(c-r)<=tl?'<b class="ok">PASS</b>':'<b class="no">FAIL</b>']))};
